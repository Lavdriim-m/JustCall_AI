# Fly.io config for the voice server (alternative to Render).
#   fly launch --no-deploy --copy-config --dockerfile apps/voice/Dockerfile   (from the repo root)
#   fly secrets set DATABASE_URL=… OPENAI_API_KEY=… TWILIO_AUTH_TOKEN=… …
#   fly deploy --config apps/voice/fly.toml --dockerfile apps/voice/Dockerfile .
app = "justcall-voice"
primary_region = "fra"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "pnpm --filter @justcall/db migrate"

[env]
  PORT = "8080"
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "connections"
    soft_limit = 150
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
