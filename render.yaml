# Render Blueprint: deploys the voice server in Frankfurt. The web app runs on Vercel (see
# docs/DEPLOYMENT.md).
# Render → New → Blueprint → select this repository. Render then asks once for every env var marked
# sync: false. It only asks when the Blueprint is first created; later syncs ignore sync: false keys, so
# add new secrets by hand (Dashboard → justcall-voice → Environment).
# Render ignores sync: false inside envVarGroups, so the secrets are defined on the service itself.
services:
  - type: web
    name: justcall-voice
    runtime: docker
    region: frankfurt
    # Legacy plan ID, still accepted in Blueprints. The dashboard shows it as 1c-2g (1 CPU / 2 GB).
    plan: standard
    dockerfilePath: apps/voice/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    preDeployCommand: pnpm --filter @justcall/db migrate
    # Lets running calls finish during a deploy: Render sends SIGTERM, waits up to this long (default 30,
    # max 300), then kills the instance. DRAIN_TIMEOUT_SECONDS must stay a few seconds below it.
    maxShutdownDelaySeconds: 300
    envVars:
      - fromGroup: justcall
      - { key: PORT, value: "8080" }
      - { key: DRAIN_TIMEOUT_SECONDS, value: "290" }
      # Connections per instance; keep it × instances below the Supabase session pooler Pool Size.
      - { key: DATABASE_POOL_MAX, value: "10" }
      # Asked for when the Blueprint is created:
      - { key: DATABASE_URL, sync: false }
      - { key: APP_URL, sync: false }
      - { key: VOICE_PUBLIC_URL, sync: false }
      - { key: OPENAI_API_KEY, sync: false }
      - { key: AWS_ACCESS_KEY_ID, sync: false }
      - { key: AWS_SECRET_ACCESS_KEY, sync: false }
      - { key: TWILIO_ACCOUNT_SID, sync: false }
      - { key: TWILIO_AUTH_TOKEN, sync: false }
      - { key: SMTP_HOST, sync: false }
      - { key: SMTP_USER, sync: false }
      - { key: SMTP_PASSWORD, sync: false }
      - { key: EMAIL_FROM, sync: false }

  # Optional: run the web app on Render instead of Vercel. To enable it, uncomment this block before you
  # create the Blueprint, so Render asks for its sync: false keys (the voice keys minus AWS, plus
  # TWILIO_CH_BUNDLE_SID / TWILIO_CH_ADDRESS_SID for buying Swiss numbers). If the Blueprint already
  # exists, Render does not ask: add those variables to justcall-web by hand.
  # - type: web
  #   name: justcall-web
  #   runtime: docker
  #   region: frankfurt
  #   plan: starter # legacy plan ID, shown as 0.5c-512mb
  #   dockerfilePath: apps/web/Dockerfile
  #   dockerContext: .
  #   healthCheckPath: /api/health
  #   envVars:
  #     - fromGroup: justcall
  #     - { key: PORT, value: "3000" }
  #     - { key: DATABASE_URL, sync: false }
  #     - { key: APP_URL, sync: false }
  #     - { key: VOICE_PUBLIC_URL, sync: false }
  #     - { key: OPENAI_API_KEY, sync: false }
  #     - { key: TWILIO_ACCOUNT_SID, sync: false }
  #     - { key: TWILIO_AUTH_TOKEN, sync: false }
  #     - { key: TWILIO_CH_BUNDLE_SID, sync: false }
  #     - { key: TWILIO_CH_ADDRESS_SID, sync: false }
  #     - { key: SMTP_HOST, sync: false }
  #     - { key: SMTP_USER, sync: false }
  #     - { key: SMTP_PASSWORD, sync: false }
  #     - { key: EMAIL_FROM, sync: false }

envVarGroups:
  # Fixed values and generated secrets only. Copy INTERNAL_API_SECRET (must be identical) and
  # BETTER_AUTH_SECRET to the web app on Vercel. CRON_SECRET only matters for an external scheduler.
  - name: justcall
    envVars:
      - { key: BETTER_AUTH_SECRET, generateValue: true }
      - { key: INTERNAL_API_SECRET, generateValue: true }
      - { key: CRON_SECRET, generateValue: true }
      - { key: LLM_PROVIDER, value: openai }
      - { key: OPENAI_MODEL, value: gpt-5.4-mini }
      - { key: OPENAI_REASONING_EFFORT, value: "none" }
      - { key: STT_PROVIDER, value: aws }
      - { key: TTS_PROVIDER, value: polly }
      - { key: AWS_REGION, value: eu-central-1 }
      - { key: TRANSCRIBE_LANGUAGE, value: de-CH }
      - { key: POLLY_VOICE, value: Sabrina }
      - { key: POLLY_ENGINE, value: generative }
      - { key: TWILIO_SMS_FROM, value: JustCall }
      - { key: SMTP_PORT, value: "465" }
